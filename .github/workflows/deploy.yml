name: Build & Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      APP_SECRET: "build-time-placeholder-secret"
      DATABASE_URL: "postgresql://user:pass@localhost:5432/dummy"
      SKIP_DB_CHECK: "1"
      TRACKER_SCRIPT_NAME: "mehro.js"
      DISABLE_TELEMETRY: "1"
      MCP_ENABLED: "1"
      NODE_OPTIONS: "--max-old-space-size=4096"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Generate Prisma client
        run: pnpm generate:db:client

      - name: Build workspace packages
        run: pnpm build:packages

      - name: Run unit tests
        run: pnpm test

      - name: Run workspace package tests
        run: pnpm test:packages

      - name: Check tracker types
        run: pnpm check:tracker

      - name: Build application
        run: pnpm build

      - name: Package build artifacts
        run: |
          tar -czf deploy-bundle.tar.gz \
            --exclude='.next/cache' \
            .next \
            public/script.js \
            public/recorder.js \
            public/openapi.json \
            geo \
            src/generated \
            generated \
            packages/api-client/dist \
            packages/mcp/dist

      - name: Upload deploy bundle
        uses: actions/upload-artifact@v4
        with:
          name: deploy-bundle
          path: deploy-bundle.tar.gz
          retention-days: 1

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Download deploy bundle
        uses: actions/download-artifact@v4
        with:
          name: deploy-bundle

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload bundle and deploy script to server
        run: |
          cat << 'EOF' > deploy-remote.sh
          #!/usr/bin/env bash
          set -euo pipefail
          trap 'rm -f /tmp/deploy-remote.sh /tmp/mehro-analytics-deploy.tar.gz' EXIT
          export PATH="/usr/bin:$PATH"

          APP_DIR="/home/the-host/mehro-analytics"
          BACKUP_DIR="/home/the-host/backups"
          mkdir -p "$BACKUP_DIR"

          cd "$APP_DIR"
          set -a
          . ./.env
          set +a

          # Pre-deploy database backup (keep last 5)
          pg_dump "$DATABASE_URL" | gzip > "$BACKUP_DIR/mehro_analytics_pre_deploy_$(date +%F_%H%M%S).sql.gz"
          ls -1t "$BACKUP_DIR"/mehro_analytics_pre_deploy_*.sql.gz | tail -n +6 | xargs -r rm -f

          # Sync repository state (keeps untracked .env and ecosystem.config.cjs)
          git fetch origin master
          git reset --hard origin/master

          # Install dependencies & apply Prisma migrations
          /usr/bin/pnpm install --frozen-lockfile
          /usr/bin/pnpm build:db
          /usr/bin/pnpm check:db

          # Extract prebuilt bundle cleanly
          rm -rf /tmp/mehro-bundle
          mkdir -p /tmp/mehro-bundle
          tar -xzf /tmp/mehro-analytics-deploy.tar.gz -C /tmp/mehro-bundle

          rm -rf .next.old
          if [ -d .next ]; then mv .next .next.old; fi
          mv /tmp/mehro-bundle/.next .next
          rm -rf .next.old

          cp -f /tmp/mehro-bundle/public/script.js public/script.js
          cp -f /tmp/mehro-bundle/public/recorder.js public/recorder.js
          cp -f /tmp/mehro-bundle/public/openapi.json public/openapi.json
          mkdir -p geo packages/api-client/dist packages/mcp/dist
          cp -af /tmp/mehro-bundle/geo/. geo/
          cp -af /tmp/mehro-bundle/packages/api-client/dist/. packages/api-client/dist/
          cp -af /tmp/mehro-bundle/packages/mcp/dist/. packages/mcp/dist/
          rm -rf /tmp/mehro-bundle

          # Restart PM2 process so new Next.js & Node binaries are loaded
          pm2 restart mehro-analytics --update-env || pm2 start ecosystem.config.cjs --only mehro-analytics
          pm2 save

          # Health check (API heartbeat, SSR login branding, and tracker script)
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:3005/api/heartbeat >/dev/null && curl -sf http://127.0.0.1:3005/login | grep -q "mehro analytics"; then
              echo "Health check passed"
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "Health check failed after 20 attempts"
              pm2 logs mehro-analytics --lines 30 --nostream || true
              exit 1
            fi
            sleep 2
          done

          curl -sf http://127.0.0.1:3005/api/heartbeat
          echo ""
          curl -sf -o /dev/null -w "login HTTP %{http_code}\n" http://127.0.0.1:3005/login
          curl -sf -o /dev/null -w "mehro.js HTTP %{http_code}\n" http://127.0.0.1:3005/mehro.js
          EOF
          scp -i ~/.ssh/deploy_key deploy-bundle.tar.gz "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/mehro-analytics-deploy.tar.gz"
          scp -i ~/.ssh/deploy_key deploy-remote.sh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/deploy-remote.sh"

      - name: Deploy and verify on server
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "bash /tmp/deploy-remote.sh"

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
